name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ctest (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: scripts/setup-linux-deps.sh
      - name: Build
        run: cmake -B build && cmake --build build -j"$(nproc)"
      - name: Test
        run: cd build && ctest --output-on-failure
      - name: Test LuCI logic
        run: node packaging/openwrt/luci-app-telldus-mqtt/tests/check-syntax.js && node packaging/openwrt/luci-app-telldus-mqtt/tests/test-logic.js

  openwrt:
    name: OpenWrt ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - mvebu-cortexa9-23.05.2       # Linksys WRT3200ACM
          - mvebu-cortexa9-openwrt-24.10
          - ath79-generic-22.03.2        # Netgear WNDR3700 v2 (AlbinRouter)
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      # Builds packaging/openwrt/package (the draft for openwrt/packages) with the
      # source replaced by this checkout, and luci-app-telldus-mqtt in the
      # luci feed tree (it includes ../../luci.mk).
      - name: Build in OpenWrt SDK
        run: |
          mkdir -p out
          sudo chown -R 1000:1000 src out
          docker run --rm -v "$PWD/src:/src" -v "$PWD/out:/out" \
            ghcr.io/openwrt/sdk:${{ matrix.sdk }} bash -c '
            set -e
            [ ! -f setup.sh ] || bash setup.sh
            sed -e "s,https://git.openwrt.org/feed/,https://github.com/openwrt/," \
                -e "s,https://git.openwrt.org/openwrt/,https://github.com/openwrt/," \
                -e "s,https://git.openwrt.org/project/,https://github.com/openwrt/," \
                feeds.conf.default > feeds.conf
            ./scripts/feeds update -a
            # luci.mk takes the version from git: commit the app in the feed
            cp -r /src/packaging/openwrt/luci-app-telldus-mqtt feeds/luci/applications/
            git -C feeds/luci add applications/luci-app-telldus-mqtt
            git -C feeds/luci -c user.name=ci -c user.email=ci@localhost \
                commit -q -m "luci-app-telldus-mqtt from CI"
            ./scripts/feeds update -i luci
            ./scripts/feeds install -a
            # Replace the telldus-mqtt package of the packages feed
            rm -f package/feeds/packages/telldus-mqtt
            cp -r /src/packaging/openwrt/package package/telldus-mqtt
            mk=package/telldus-mqtt/Makefile
            sed -i -e "/^PKG_SOURCE_PROTO/d" -e "/^PKG_SOURCE_URL/d" \
                   -e "/^PKG_SOURCE_VERSION/d" -e "/^PKG_MIRROR_HASH/d" "$mk"
            sed -i "/^\$(eval \$(call BuildPackage/i define Build/Prepare\n\tmkdir -p \$(PKG_BUILD_DIR)\n\tcp -r /src/. \$(PKG_BUILD_DIR)\n\trm -rf \$(PKG_BUILD_DIR)/.git \$(PKG_BUILD_DIR)/build\nendef\n" "$mk"
            cat "$mk"
            make defconfig
            make package/telldus-mqtt/compile V=s -j"$(nproc)"
            make package/luci-app-telldus-mqtt/compile V=s -j"$(nproc)"
            find bin \( -name "telldus-mqtt*.[ia]pk" -o -name "luci-app-telldus-mqtt*.[ia]pk" \) -exec cp {} /out/ \;
            ls -l /out
            ls /out | grep -q "^telldus-mqtt.*pk" || { echo "telldus-mqtt package not built"; exit 1; }
            ls /out | grep -q "^luci-app-telldus-mqtt.*pk" || { echo "luci-app-telldus-mqtt package not built"; exit 1; }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: telldus-mqtt-${{ matrix.sdk }}
          path: out/*
